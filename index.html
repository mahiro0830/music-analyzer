<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音楽分析</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main class="app">
  <header>
    <h1>音楽分析</h1>
    <p class="sub">音声ファイルのコードを、再生に合わせて表示します（試作版）</p>
  </header>

  <section id="drop" class="drop">
    <p>音声ファイル（mp3・wav・m4a など）をここにドロップ</p>
    <div class="row">
      <label class="btn primary">ファイルを選ぶ<input id="file" type="file" accept="audio/*,.mp3,.wav,.m4a,.aif,.aiff,.flac,.ogg" hidden></label>
      <button id="demo" class="btn">デモ曲で試す</button>
    </div>
    <p id="msg" class="msg" aria-live="polite">ファイルはこのブラウザの中だけで解析します。どこにも送信しません。</p>
  </section>

  <section id="player" hidden>
    <div class="head">
      <h2 id="title"></h2>
      <span id="key" class="key"></span>
    </div>
    <div class="now-box">
      <div class="now-label">いま</div>
      <div id="now" class="now">—</div>
      <div class="bar"><i id="bar"></i></div>
      <div class="next-line">次 <span id="next"></span></div>
    </div>
    <div class="transport">
      <audio id="audio" controls preload="auto"></audio>
      <label class="speed">速さ
        <select id="speed">
          <option value="0.5">0.5×</option>
          <option value="0.75">0.75×</option>
          <option value="1" selected>1×</option>
        </select>
      </label>
    </div>
    <h3>コード進行 <small>押すとそこから再生</small></h3>
    <div id="list" class="list"></div>
    <p class="note">耳コピの手がかりとしての推定です。判定できるのはメジャー・マイナー・7th・Maj7・min7・min7♭5・sus4 です（テンションや分数コードはまだ出ません）。</p>
  </section>
</main>
<script src="js/chords.js"></script>
<script src="js/app.js"></script>
</body>
</html>
